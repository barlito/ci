name: test-php-ci-failures

on: workflow_dispatch

permissions: {}

jobs:
  failing-check:
    permissions:
      contents: read
    uses: ./.github/workflows/php-ci.yaml # zizmor: ignore[self-repository] actionlint rejects the $/ syntax
    with:
      working-directory: tests/fixtures/php-ci
      checks: check.fail check.ok
      tests: test.ok

  failing-test:
    permissions:
      contents: read
    uses: ./.github/workflows/php-ci.yaml # zizmor: ignore[self-repository] actionlint rejects the $/ syntax
    with:
      working-directory: tests/fixtures/php-ci
      checks: check.ok
      tests: test.fail test.ok
