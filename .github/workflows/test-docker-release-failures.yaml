name: test-docker-release-failures

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/docker-release.yaml
      - .github/workflows/test-docker-release.yaml
      - .github/workflows/test-docker-release-failures.yaml

permissions: {}

jobs:
  bad-semver:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-release.yaml  # zizmor: ignore[self-repository]
    with:
      images: '[{"name":"barlito/ci-test-app","target":"app"}]'
      context: tests/fixtures/app
      registry: ghcr.io
      e2e-tag: 1.2.3

  not-a-tag:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-release.yaml  # zizmor: ignore[self-repository]
    with:
      images: '[{"name":"barlito/ci-test-app","target":"app"}]'
      context: tests/fixtures/app
      registry: ghcr.io
