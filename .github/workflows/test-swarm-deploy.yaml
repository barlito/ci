name: test-swarm-deploy

on:
  pull_request:
    paths:
      - .github/workflows/swarm-deploy.yaml
      - .github/workflows/swarm-rollback.yaml
      - .github/workflows/test-swarm-deploy.yaml
      - .github/workflows/test-swarm-deploy-failures.yaml
      - .github/scripts/assert-failure-cases.sh
      - tests/fixtures/swarm-deploy/**
      - tests/fixtures/app/**

permissions: {}

concurrency:
  group: test-swarm-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keys:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      client-key: ${{ steps.keys.outputs.client-key }}
      sshd-host-key: ${{ steps.keys.outputs.sshd-host-key }}
      host-key-line: ${{ steps.keys.outputs.host-key-line }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: keys
        run: tests/fixtures/swarm-deploy/gen-keys.sh 127.0.0.1 2222

  deploy-full:
    needs: keys
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/swarm-deploy.yaml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax
    with:
      full: true
      environment: e2e
      images: localhost:5000/fixture-app localhost:5000/fixture-worker
      env-secrets: DOCKER_HUB_USERNAME
      working-directory: tests/fixtures/swarm-deploy
      e2e-local-target: true
      e2e-tag: v1.1.0
    secrets:
      SERVER_USERNAME: runner
      SERVER_PORT: "2222"
      SERVER_HOST_KEY: ${{ needs.keys.outputs.host-key-line }}
      SSH_PRIVATE_KEY: ${{ needs.keys.outputs.client-key }}
      DOCKER_HUB_USERNAME: e2e-user
      DOCKER_HUB_READ_ONLY_ACCESS_TOKEN: e2e-read-only-token
      e2e-ssh-host-key: ${{ needs.keys.outputs.sshd-host-key }}

  deploy-update:
    needs: [keys, deploy-full]
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/swarm-deploy.yaml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax
    with:
      environment: e2e
      images: |
        localhost:5000/fixture-app
        localhost:5000/fixture-worker
      env-secrets: |
        DOCKER_HUB_USERNAME
        SERVER_USERNAME
      optional-env-secrets: DOCKER_HUB_READ_ONLY_ACCESS_TOKEN E2E_OPT_MISSING
      castor: true
      working-directory: tests/fixtures/swarm-deploy
      e2e-local-target: true
      e2e-tag: v1.1.0
    secrets:
      SERVER_USERNAME: runner
      SERVER_PORT: "2222"
      SERVER_HOST_KEY: ${{ needs.keys.outputs.host-key-line }}
      SSH_PRIVATE_KEY: ${{ needs.keys.outputs.client-key }}
      DOCKER_HUB_USERNAME: e2e-user
      DOCKER_HUB_READ_ONLY_ACCESS_TOKEN: e2e-read-only-token
      e2e-ssh-host-key: ${{ needs.keys.outputs.sshd-host-key }}

  rollback:
    needs: [keys, deploy-update]
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/swarm-rollback.yaml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax
    with:
      tag: v1.0.0
      restore: "1"
      environment: e2e
      images: localhost:5000/fixture-app localhost:5000/fixture-worker
      working-directory: tests/fixtures/swarm-deploy
      e2e-local-target: true
    secrets:
      SERVER_USERNAME: runner
      SERVER_PORT: "2222"
      SERVER_HOST_KEY: ${{ needs.keys.outputs.host-key-line }}
      SSH_PRIVATE_KEY: ${{ needs.keys.outputs.client-key }}
      DOCKER_HUB_USERNAME: e2e-user
      DOCKER_HUB_READ_ONLY_ACCESS_TOKEN: e2e-read-only-token
      e2e-ssh-host-key: ${{ needs.keys.outputs.sshd-host-key }}

  assert-happy-path:
    needs: [deploy-full, deploy-update, rollback]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      deployments: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Assert served versions, traces and the Deployment
        run: |
          set -euo pipefail
          log() {
            id=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate --jq ".jobs[] | select(.name | startswith(\"$1 /\")) | .id" | head -n1)
            [ -n "$id" ] || { echo "::error::job $1 not found" >&2; exit 1; }
            gh api --allow-escape-sequences "repos/$REPO/actions/jobs/$id/logs"
          }
          expect() { grep -Eq -- "$2" <<<"$1" || { echo "::error::missing in log: $2"; exit 1; }; }
          host='DOCKER_HOST=ssh://\*+@127\.0\.0\.1:\*+'

          out=$(log deploy-full)
          expect "$out" "deploy\.prod TAG=v1\.1\.0 RESTORE= $host "
          expect "$out" 'deploy\.prod exported=DOCKER_HUB_USERNAME castor=no'
          expect "$out" 'E2E-SERVED ok v1\.1\.0'

          out=$(log deploy-update)
          expect "$out" "deploy\.update TAG=v1\.1\.0 RESTORE= $host "
          expect "$out" 'deploy\.update exported=DOCKER_HUB_READ_ONLY_ACCESS_TOKEN,DOCKER_HUB_USERNAME,SERVER_USERNAME castor=yes optional=DOCKER_HUB_READ_ONLY_ACCESS_TOKEN:set,E2E_OPT_MISSING:empty'
          expect "$out" 'Optional secrets not set, exported empty: E2E_OPT_MISSING'
          expect "$out" 'Found localhost:5000/fixture-worker:v1\.1\.0'
          expect "$out" 'E2E-SERVED ok v1\.1\.0'

          out=$(log rollback)
          expect "$out" "rollback TAG=v1\.0\.0 RESTORE=1 $host "
          expect "$out" 'rollback exported= castor=no'
          expect "$out" 'E2E-SERVED ok v1\.0\.0'

          ids=$(gh api "repos/$REPO/deployments?environment=e2e&sha=$SHA" --jq '.[].id')
          succeeded=0
          for id in $ids; do
            gh api "repos/$REPO/deployments/$id/statuses" \
              --jq ".[] | select(.state == \"success\" and (.log_url | contains(\"/actions/runs/$RUN_ID/\"))) | .id" | grep . >/dev/null \
              && succeeded=$((succeeded + 1))
          done
          [ "$succeeded" -eq 3 ] || { echo "::error::expected 3 successful Deployments of run $RUN_ID for environment e2e, got $succeeded"; exit 1; }

  failures:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch the expected-failure cases and assert their outcome
        run: |
          .github/scripts/assert-failure-cases.sh test-swarm-deploy-failures.yaml 1500 \
            'not-a-tag::This workflow must run on a tag' \
            "invalid-tag::Invalid tag 'v1.1'" \
            'no-tag-with-images::require-tag: false is only allowed when images is empty' \
            "missing-secret::Secret 'DOES_NOT_EXIST' listed in env-secrets does not exist" \
            'missing-image::Image localhost:5000/does-not-exist:v1.1.0 not found' \
            'wrong-host-key::SSH connection to the server failed' \
            'unknown-rollback-tag::Tag v9.9.9 does not exist in the repository' \
            'rollback-not-default-branch::Rollback must run on the default branch' \
            "reserved-secret-name::Secret name 'MAKEFLAGS' is reserved" \
            "lowercase-secret-name::Invalid secret name 'github_token'" \
            "duplicate-optional-secret::Secret 'DOCKER_HUB_USERNAME' is listed in both env-secrets and optional-env-secrets" \
            "invalid-optional-secret-name::Invalid secret name 'lower_case'" \
            'target-failure-no-recover::make e2e.fail failed' \
            'target-failure-no-recover::deploy.recover is not defined, skipping recovery' \
            'target-failure::make e2e.fail failed' \
            'target-failure::deploy.recover exported= castor=no' \
            'target-failure::E2E-EVIDENCE-END' \
            'target-timeout::make e2e.hang failed or was interrupted' \
            'target-timeout::deploy.recover exported= castor=no' \
            'target-timeout::E2E-EVIDENCE-END'
