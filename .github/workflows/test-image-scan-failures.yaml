name: test-image-scan-failures

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/never-triggered

permissions: {}

jobs:
  findings-fail:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/image-scan.yaml # zizmor: ignore[self-repository]
    with:
      dockerfile: tests/fixtures/image-scan/vulnerable/Dockerfile
      context: tests/fixtures/image-scan/vulnerable
      fail-on-findings: true
