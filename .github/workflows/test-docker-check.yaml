name: test-docker-check

on:
  pull_request:
    paths:
      - .github/workflows/docker-check.yaml
      - .github/workflows/test-docker-check.yaml
      - .github/workflows/test-docker-check-failures.yaml
      - .github/scripts/assert-failure-cases.sh
      - tests/fixtures/app/**
      - tests/fixtures/docker-check/**

permissions: {}

concurrency:
  group: test-docker-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-ok:
    permissions:
      contents: read
    uses: ./.github/workflows/docker-check.yaml # zizmor: ignore[self-repository]
    with:
      dockerfile: tests/fixtures/app/Dockerfile
      context: tests/fixtures/app
      targets: app worker
      compose-files: tests/fixtures/app/docker-compose-prod.yml
      compose-env: |
        TAG=v0.0.0
        CONFIG_VERSION=test

  no-build:
    permissions:
      contents: read
    uses: ./.github/workflows/docker-check.yaml # zizmor: ignore[self-repository]
    with:
      targets: ""
      compose-files: tests/fixtures/docker-check/no-build-compose.yml

  expected-failures:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch failure cases and assert
        run: |
          .github/scripts/assert-failure-cases.sh test-docker-check-failures.yaml 2700 \
            'broken-compose::did not find expected' \
            'broken-dockerfile::did not complete successfully' \
            'missing-env::CONFIG_VERSION is required'
